<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon-D4Ab5og6.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>the camera of oo1 studio</title>
        <link rel="stylesheet" href="https://core.oo1.studio/outsync.css" />
      <script type="module" crossorigin src="/assets/index-MSFsDl6F.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-CPhxnmbx.css">
    </head>
    <body
        class="bg-white text-black dark:bg-black dark:text-white m-0 overflow-hidden select-none font-mono"
    >
        <!-- Main full-screen container -->
        <main
            class="w-dvw h-dvh p-(--padding) flex flex-col landscape:flex-row items-center rounded(--layer-corner-radius)"
        >
            <!-- Main Viewfinder -->
            <video
                id="viewfinder"
                autoplay
                playsinline
                muted
                style="--layer: 1"
                class="w-full landscape:w-auto landscape:h-full shrink-0 aspect-square bg-zinc-900 object-cover rounded-(--layer-corner-radius) transition-all duration-100"
            ></video>

            <!-- Buttons container -->
            <div
                class="w-full landscape:h-full landscape:w-auto flex flex-row gap-4 items-center justify-center flex-1"
            >
                <!-- Capture Button -->
                <div
                    id="capture-button"
                    style="--layer: 1"
                    class="relative overflow-hidden text-white rounded-(--layer-corner-radius) h-(--layer-height) min-w-[calc(var(--layer-min-height)*2)] px-(--layer-corner-radius) flex flex-col items-center justify-center transition-all duration-150 active:scale-90 cursor-pointer"
                >
                    <!-- 1. The live camera feed, directly blurred and slightly scaled to keep edges clean -->
                    <video
                        id="button-viewfinder"
                        autoplay
                        playsinline
                        muted
                        class="absolute inset-0 w-full h-full object-cover pointer-events-none rounded-(--layer-corner-radius) filter blur-[8px] scale-[1.08] transition-all duration-100"
                    ></video>

                    <!-- 2. The 60% black overlay (backdrop-blur-md removed to fix low-end phone bug) -->
                    <div
                        class="absolute inset-0 bg-black/60 pointer-events-none rounded-(--layer-corner-radius)"
                    ></div>

                    <!-- 3. Absolute 2px border overlay drawn on top to hide any jagged video clip edges -->
                    <div
                        class="absolute inset-0 border-2 dark:border-white/60 border-transparent rounded-(--layer-corner-radius) pointer-events-none z-20"
                    ></div>

                    <!-- 4. The text element that JS will animate -->
                    <span
                        id="capture-text"
                        class="relative z-10 pointer-events-none transition-opacity duration-[calc(var(--animation-speed)*1ms)] opacity-60"
                        >------</span
                    >
                </div>

                <!-- Flip Button (Updated to border-2 to match visual weight) -->
                <div
                    id="flip-button"
                    style="--layer: 1"
                    class="cursor-pointer border-2 border-black/40 dark:border-white/60 rounded-(--layer-corner-radius) h-(--layer-height) px-(--layer-corner-radius) flex items-center justify-center transition-all duration-150 active:scale-90"
                >
                    <span class="pointer-events-none opacity-60">flip</span>
                </div>
            </div>
        </main>

        <!-- Hidden canvas used for capturing the actual photo -->
        <canvas id="photo-canvas" class="hidden"></canvas>

    </body>
</html>
